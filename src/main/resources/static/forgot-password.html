<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="logo-mark.svg">

    <title>Aal Sikke — Forgot password</title>
    <meta name="description" content="Reset your Aal Sikke password.">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Aal Sikke">
    <meta property="og:title" content="Forgot password — Aal Sikke">
    <meta property="og:description" content="Reset your Aal Sikke password.">
    <meta property="og:image" content="logo-mark.svg">
    <meta name="twitter:card" content="summary">
    <script src="seo.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="screen">

    <div class="topbar">
        <button class="back-btn" aria-label="Back to login">&#8592;</button>
        <div class="brand"></div>
        <div class="topbar-end">
            <button class="icon-btn" id="theme-toggle-btn" aria-label="Toggle theme"></button>
        </div>
    </div>

    <div class="center-brand">
        <h1><svg class="brand-logo brand-logo--lg" viewBox="0 0 1476 240" role="img" aria-label="Aal Sikke"><use href="logo-sprite.svg#aal-logo"/></svg></h1>
        <p>Adaptive Life Management</p>
    </div>

    <form class="card" id="forgot-form" novalidate>
        <h2>Forgot your password?</h2>
        <p class="subtitle">Enter the email you signed up with. We'll send you a link to choose a new password.</p>

        <!-- shown after the request is sent -->
        <div class="login-notice" id="forgot-notice" role="status" aria-live="polite" hidden>
            <p id="forgot-notice-text"></p>
        </div>

        <div class="field" id="field-email">
            <label for="email">Email</label>
            <div class="input-wrap">
                <input type="email" id="email" name="email" placeholder="alex.chen@university.edu" autocomplete="email" required>
                <span class="icon-status success">&#10003;</span>
            </div>
            <p class="hint error-text" id="email-error">Enter a valid email address.</p>
        </div>

        <button type="submit" class="btn-primary" id="forgot-btn">Send reset link</button>

        <div class="link-row">Remembered it? <a href="login.html">Back to log in</a></div>
    </form>

    <div class="tag-row"><span class="tag">&#128274; The link works once and expires in 30 minutes</span></div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="theme-toggle.js"></script>
<script src="forgot-password.js"></script>
</body>
</html>
