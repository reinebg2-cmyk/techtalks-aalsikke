<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- the reset token is in this page's URL: never pass it on to other sites -->
    <meta name="referrer" content="no-referrer">
    <script src="theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="logo-mark.svg">

    <title>Aal Sikke — Choose a new password</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="screen">

    <div class="topbar">
        <button class="back-btn" data-i18n-aria-label="auth.backToLogin" aria-label="Back to login">&#8592;</button>
        <div class="brand"></div>
        <div class="topbar-end">
            <button class="icon-btn" id="theme-toggle-btn" aria-label="Toggle theme"></button>
        </div>
    </div>

    <div class="center-brand">
        <h1><svg class="brand-logo brand-logo--lg" viewBox="0 0 1476 240" role="img" aria-label="Aal Sikke"><use href="logo-sprite.svg#aal-logo"/></svg></h1>
        <p data-i18n="auth.tagline">Adaptive Life Management</p>
    </div>

    <form class="card" id="reset-form" novalidate>
        <h2 data-i18n="rp.title">Choose a new password</h2>
        <p class="subtitle" data-i18n="rp.subtitle">Enter a new password for your Aal Sikke account.</p>

        <!-- problems with the link, and the success message -->
        <div class="login-notice" id="reset-notice" role="status" aria-live="polite" hidden>
            <p id="reset-notice-text"></p>
            <a class="link-btn" id="request-new-link" href="forgot-password.html" data-i18n="rp.requestNew" hidden>Request a new link</a>
        </div>

        <div id="reset-fields">
            <div class="field" id="field-new-password">
                <label for="new-password" data-i18n="rp.new">New password</label>
                <div class="input-wrap">
                    <input type="password" id="new-password" name="new-password" data-i18n-placeholder="rp.newPlaceholder" placeholder="At least 8 characters" autocomplete="new-password" maxlength="72" required>
                    <button type="button" class="icon-toggle" id="toggle-new-password" data-i18n-aria-label="rp.showPassword" aria-label="Show password">&#128065;</button>
                </div>
                <div class="strength-meter" id="strength-meter" aria-hidden="true"><span></span><span></span><span></span></div>
                <p class="hint error-text" id="new-password-error"></p>
            </div>

            <div class="field" id="field-confirm-password">
                <label for="confirm-password" data-i18n="rp.confirm">Confirm new password</label>
                <div class="input-wrap">
                    <input type="password" id="confirm-password" name="confirm-password" data-i18n-placeholder="rp.confirmPlaceholder" placeholder="Repeat the password" autocomplete="new-password" maxlength="72" required>
                </div>
                <p class="hint error-text" id="confirm-error"></p>
            </div>

            <button type="submit" class="btn-primary" id="reset-btn" data-i18n="rp.submit">Reset password</button>
        </div>

        <!-- shown after a successful reset -->
        <a class="btn-primary verify-login-btn" id="go-login" href="login.html" data-i18n="rp.login" hidden>Log in</a>

        <div class="link-row" id="back-row"><span data-i18n="rp.changedMind">Changed your mind?</span> <a href="login.html" data-i18n="fp.backToLogin">Back to log in</a></div>
    </form>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="i18n.js"></script>
<script src="theme-toggle.js"></script>
<script src="reset-password.js"></script>
</body>
</html>
