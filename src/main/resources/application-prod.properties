# Production profile (Sprint 6). Activated with SPRING_PROFILES_ACTIVE=prod.
# Everything secret or environment-specific comes from environment variables.
# Required variables have NO default on purpose: if one is missing, the app
# refuses to start instead of running with a wrong value.
#
# Required: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, APP_BASE_URL,
#           MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM
# Optional: PORT (default 8080), DB_POOL_SIZE (default 5),
#           MAIL_HOST / MAIL_PORT (default Gmail, see application.properties)
# Never put real values in this file.

# Database, e.g. jdbc:postgresql://host:5432/dbname?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Managed databases allow few connections
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# The schema is owned by Flyway only. A fresh database must run every
# migration from V1, never be baselined.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false

# Auth
jwt.secret=${JWT_SECRET}

# Public address of the site, used in email links (no trailing slash)
app.base-url=${APP_BASE_URL}

# Email is required in production: users can't log in without verifying.
app.mail.enabled=true
# Sender address, required: some SMTP services use a login that is not an email
# (e.g. "apikey"), and a non-email sender makes every email fail silently.
app.mail.from=${MAIL_FROM}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Web server: the platform may choose the port, and HTTPS ends at its proxy
server.port=${PORT:8080}
server.forward-headers-strategy=framework